    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;

      background: linear-gradient(180deg, #111827 0%, #1e293b 100%);
      color: white; padding: 20px;
    }
    .container { width: 100%; max-width: 480px; margin: 0 auto; padding-top: 50px; }
    .title { text-align: center; font-size: 36px; font-weight: 800; margin-bottom: 10px; letter-spacing: 2px; }
    .subtitle { text-align: center; font-size: 16px; color: #cbd5e1; margin-bottom: 35px; }
    .difficulty-buttons { display: flex; flex-direction: column; gap: 18px; }
    .difficulty-button {
      width: 100%; border: none; border-radius: 16px; padding: 22px 20px;
      font-size: 24px; font-weight: bold; color: white; cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }
    .beginner { background: #2563eb; }
    .intermediate { background: #d97706; }
    .advanced { background: #dc2626; }
    .description { display: block; font-size: 14px; font-weight: normal; margin-top: 6px; opacity: 0.9; }
    .footer { text-align: center; margin-top: 35px; font-size: 13px; color: #94a3b8; }
    #quiz-screen, #result-screen { display: none; }
    .quiz-header { text-align: center; margin-bottom: 20px; }
    .quiz-level { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
    .question-number { color: #cbd5e1; font-size: 15px; }
    .question-box {
      background: white; color: #111827; border-radius: 16px; padding: 25px 20px;
      margin-bottom: 20px; font-size: 20px; font-weight: bold; line-height: 1.6; text-align: center;
    }
    .answers { display: flex; flex-direction: column; gap: 12px; }
    .answer-button {
      width: 100%; border: none; border-radius: 12px; padding: 17px 15px;
      font-size: 17px; font-weight: bold; background: #334155; color: white;
      cursor: pointer; text-align: left;
    }
    .answer-button:disabled { cursor: default; opacity: 1; }
    .correct { background: #16a34a !important; }
    .incorrect { background: #dc2626 !important; }
    .explanation {
      display: none; background: #f8fafc; color: #1e293b; border-radius: 12px;
      padding: 18px; margin-top: 18px; line-height: 1.6; font-size: 15px;
    }
    .next-button {
      display: none; width: 100%; border: none; border-radius: 12px; padding: 17px;
      margin-top: 15px; font-size: 18px; font-weight: bold; background: #2563eb;
      color: white; cursor: pointer;
    }
    .result-title { text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 25px; }
    .score-box {
      background: white; color: #111827; border-radius: 16px; padding: 30px 20px;
      text-align: center; margin-bottom: 20px;
    }
    .score { font-size: 48px; font-weight: 800; margin-bottom: 10px; }
    .score-message { font-size: 18px; font-weight: bold; }
    .result-button {
      width: 100%; border: none; border-radius: 12px; padding: 17px; margin-top: 12px;
      font-size: 18px; font-weight: bold; cursor: pointer; color: white;
    }
    .retry { background: #2563eb; }
    .back { background: #475569; }
  </style>
</head>

      <div class="footer">初級300問・中級300問・上級300問</div>

    <div id="quiz-screen">

      <div class="explanation" id="explanation"></div>
      <button class="next-button" id="next-button" onclick="nextQuestion()">次の問題</button>

    <div id="result-screen">

      <div class="score-box">

    </div>
  </div>

    const QUESTIONS_PER_QUIZ = 10;

    let currentQuestion = 0;
    let score = 0;
    let shuffledQuestions = [];

    /*
      問題ストックからランダムに必要な問題数だけ抽出
    */
    function pickRandomQuestions(questionPool, count) {
      const pool = [...questionPool];

      // Fisher-Yates方式でシャッフル
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      return pool.slice(0, Math.min(count, pool.length));
    }

    function startQuiz(level) {
      let questionPool;

      if (level === '初級') {
        questionPool = beginnerQuestions;
      } else if (level === '中級') {
        questionPool = intermediateQuestions;
      } else if (level === '上級') {
        questionPool = advancedQuestions;
      } else {
        notReady();
        return;
      }

      currentQuestion = 0;
      score = 0;

      // 選択したレベルの問題ストックから10問だけを毎回ランダム抽出
      shuffledQuestions = pickRandomQuestions(
        questionPool,
        QUESTIONS_PER_QUIZ
      );

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';

      document.getElementById('quiz-level').textContent = `${level}クイズ`;

      const retryButton = document.getElementById('retry-button');
      retryButton.setAttribute('onclick', `startQuiz('${level}')`);

      showQuestion();
    }

    function showQuestion() {
  const q = shuffledQuestions[currentQuestion];
  const questionNumber = document.getElementById("question-number");
  const questionText = document.getElementById("question");
  const answers = document.getElementById("answers");
  const explanation = document.getElementById("explanation");
  const nextButton = document.getElementById("next-button");

  questionNumber.textContent = `第${currentQuestion + 1}問 / ${QUESTIONS_PER_QUIZ}問`;
  questionText.textContent = q.question;

  // 前の問題の解説・次へボタンをリセット
  explanation.style.display = "none";
  explanation.innerHTML = "";
  nextButton.style.display = "none";
  nextButton.textContent =
    currentQuestion < shuffledQuestions.length - 1 ? "次へ" : "結果を見る";

  answers.innerHTML = "";

  // 正解情報を保ったまま、4つの選択肢を毎回ランダムに並べ替える
  const shuffledChoices = q.choices.map((choice, index) => ({
    choice,
    isCorrect: index === q.answer
  }));

  // Fisher-Yatesシャッフル
  for (let i = shuffledChoices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledChoices[i], shuffledChoices[j]] =
      [shuffledChoices[j], shuffledChoices[i]];
  }

  shuffledChoices.forEach((item) => {
    const button = document.createElement("button");
    button.className = "answer-button";
    button.textContent = item.choice;
    button.dataset.correct = item.isCorrect ? "true" : "false";
    button.addEventListener("click", () => selectAnswer(button));
    answers.appendChild(button);
  });
}

function selectAnswer(selectedButton) {
  const buttons = document.querySelectorAll(".answer-button");
  const isCorrect = selectedButton.dataset.correct === "true";
  const q = shuffledQuestions[currentQuestion];

  // すべての選択肢を押せない状態にする
  buttons.forEach((button) => {
    button.disabled = true;

    // 正解の選択肢を緑色で表示
    if (button.dataset.correct === "true") {
      button.classList.add("correct");
    }
  });

  // 選択した答えが不正解なら赤色で表示
  if (!isCorrect) {
    selectedButton.classList.add("incorrect");
  }

  if (isCorrect) {
    score++;
  }

  // 正解・不正解と解説を表示
  const explanation = document.getElementById("explanation");
  const nextButton = document.getElementById("next-button");

  explanation.innerHTML = `
    <div style="font-size:20px;font-weight:bold;margin-bottom:8px;">
      ${isCorrect ? "正解！" : "不正解"}
    </div>
    <div>${q.explanation || "解説はありません。"}</div>
  `;
  explanation.style.display = "block";

  // 「次へ」ボタンを表示
  nextButton.textContent =
    currentQuestion < shuffledQuestions.length - 1 ? "次へ" : "結果を見る";
  nextButton.style.display = "block";
}

function nextQuestion() {
  currentQuestion++;

  if (currentQuestion < shuffledQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';

      document.getElementById('score').textContent =
        `${score} / ${shuffledQuestions.length}`;

      const message = document.getElementById('score-message');

      if (score === shuffledQuestions.length) {
        message.textContent = '全問正解！';
      } else if (score >= 8) {
        message.textContent = 'すごい！';
      } else if (score >= 5) {
        message.textContent = 'よくできました！';
      } else {
        message.textContent = 'もう一度挑戦してみよう！';
      }
    }

    function backToStart() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
    }

    function notReady() {
      alert('中級・上級は準備中です。');
    }
  </script>
