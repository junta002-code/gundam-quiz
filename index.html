<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>ガンダムクイズ</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #111827 0%,
          #1e293b 100%
        );

      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .title {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 35px;
    }

    .difficulty-buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .difficulty-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 22px 20px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      cursor: pointer;

      box-shadow:
        0 6px 15px rgba(0, 0, 0, 0.3);

      transition:
        transform 0.1s,
        opacity 0.1s;
    }

    .difficulty-button:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    .beginner {
      background: #2563eb;
    }

    .intermediate {
      background: #d97706;
    }

    .advanced {
      background: #dc2626;
    }

    .description {
      display: block;
      font-size: 14px;
      font-weight: normal;
      margin-top: 6px;
      opacity: 0.9;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #94a3b8;
    }

    /* クイズ画面 */
    #quiz-screen {
      display: none;
    }

    .quiz-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .question-box {
      background: white;
      color: #111827;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .back-button {
      border: none;
      background: #475569;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 難易度選択画面 -->
    <div id="start-screen">

      <div class="title">
        ガンダムクイズ
      </div>

      <div class="subtitle">
        難易度を選んでください
      </div>

      <div class="difficulty-buttons">

        <button
          class="difficulty-button beginner"
          onclick="startQuiz('初級')"
        >
          初級
          <span class="description">
            ガンダムの基本問題
          </span>
        </button>

        <button
          class="difficulty-button intermediate"
          onclick="startQuiz('中級')"
        >
          中級
          <span class="description">
            少し難しいガンダム問題
          </span>
        </button>

        <button
          class="difficulty-button advanced"
          onclick="startQuiz('上級')"
        >
          上級
          <span class="description">
            ガンダムを極めた人向け
          </span>
        </button>

      </div>

      <div class="footer">
        全3レベル・各100問予定
      </div>

    </div>


    <!-- クイズ画面 -->
    <div id="quiz-screen">

      <div class="quiz-title" id="quiz-level">
        初級
      </div>

      <div class="question-box">
        ここに問題が表示されます
      </div>

      <button
        class="back-button"
        onclick="backToStart()"
      >
        難易度選択に戻る
      </button>

    </div>

  </div>


  <script>

    // 現在選択されている難易度
    let currentLevel = "";

    // 難易度を選択
    function startQuiz(level) {

      currentLevel = level;

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";

      document.getElementById("quiz-level").textContent =
        level + "クイズ";
    }

    // 難易度選択画面に戻る
    function backToStart() {

      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("start-screen").style.display = "block";

      currentLevel = "";
    }

  </script>

</body>
</html>
