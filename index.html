<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>ガンダムクイズ</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: linear-gradient(
        180deg,
        #111827 0%,
        #1e293b 100%
      );
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding-top: 50px;
    }

    .title {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 35px;
    }

    /* 難易度選択 */

    .difficulty-buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .difficulty-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 22px 20px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .beginner {
      background: #2563eb;
    }

    .intermediate {
      background: #d97706;
    }

    .advanced {
      background: #dc2626;
    }

    .description {
      display: block;
      font-size: 14px;
      font-weight: normal;
      margin-top: 6px;
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      font-size: 13px;
      color: #94a3b8;
    }

    /* クイズ画面 */

    #quiz-screen,
    #result-screen {
      display: none;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .quiz-level {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .question-number {
      color: #cbd5e1;
      font-size: 15px;
    }

    .question-box {
      background: white;
      color: #111827;
      border-radius: 16px;
      padding: 25px 20px;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.6;
      text-align: center;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px 15px;
      font-size: 17px;
      font-weight: bold;
      background: #334155;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .answer-button:disabled {
      cursor: default;
      opacity: 1;
    }

    .correct {
      background: #16a34a !important;
    }

    .incorrect {
      background: #dc2626 !important;
    }

    .explanation {
      display: none;
      background: #f8fafc;
      color: #1e293b;
      border-radius: 12px;
      padding: 18px;
      margin-top: 18px;
      line-height: 1.6;
      font-size: 15px;
    }

    .next-button {
      display: none;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    /* 結果画面 */

    .result-title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .score-box {
      background: white;
      color: #111827;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .score {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .score-message {
      font-size: 18px;
      font-weight: bold;
    }

    .result-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .retry {
      background: #2563eb;
    }

    .back {
      background: #475569;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ==================== -->
    <!-- 難易度選択画面 -->
    <!-- ==================== -->

    <div id="start-screen">

      <div class="title">
        ガンダムクイズ
      </div>

      <div class="subtitle">
        難易度を選んでください
      </div>

      <div class="difficulty-buttons">

        <button
          class="difficulty-button beginner"
          onclick="startQuiz('初級')"
        >
          初級
          <span class="description">
            ガンダムの基本問題
          </span>
        </button>

        <button
          class="difficulty-button intermediate"
          onclick="notReady()"
        >
          中級
          <span class="description">
            少し難しいガンダム問題
          </span>
        </button>

        <button
          class="difficulty-button advanced"
          onclick="notReady()"
        >
          上級
          <span class="description">
            ガンダムを極めた人向け
          </span>
        </button>

      </div>

      <div class="footer">
        初級10問・中級100問・上級100問予定
      </div>

    </div>


    <!-- ==================== -->
    <!-- クイズ画面 -->
    <!-- ==================== -->

    <div id="quiz-screen">

      <div class="quiz-header">

        <div class="quiz-level">
          初級クイズ
        </div>

        <div
          class="question-number"
          id="question-number"
        >
          第1問 / 10問
        </div>

      </div>

      <div
        class="question-box"
        id="question"
      >
      </div>

      <div
        class="answers"
        id="answers"
      >
      </div>

      <div
        class="explanation"
        id="explanation"
      >
      </div>

      <button
        class="next-button"
        id="next-button"
        onclick="nextQuestion()"
      >
        次の問題
      </button>

    </div>


    <!-- ==================== -->
    <!-- 結果画面 -->
    <!-- ==================== -->

    <div id="result-screen">

      <div class="result-title">
        クイズ終了！
      </div>

      <div class="score-box">

        <div
          class="score"
          id="score"
        >
          0 / 10
        </div>

        <div
          class="score-message"
          id="score-message"
        >
        </div>

      </div>

      <button
        class="result-button retry"
        onclick="startQuiz('初級')"
      >
        もう一度挑戦
      </button>

      <button
        class="result-button back"
        onclick="backToStart()"
      >
        難易度選択へ
      </button>

    </div>

  </div>


  <script>

       クイズ用変数
       ======================================== */

    let currentQuestion = 0;
    let score = 0;
    let shuffledQuestions = [];
